name: CI
# Fork build trigger: hardened personal Android build.

on:
  push:
    branches: [main]
    tags: ["personal-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runner already ships the Android SDK. sdkmanager is not
      # guaranteed to be on PATH, so invoke the preinstalled command-line tools explicitly.
      - name: Install NDK + CMake (whisper.cpp + llama.cpp native modules)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;25.1.8937393" "ndk;29.0.13113456" "cmake;3.22.1" "cmake;3.31.6"

      - name: Fetch vendored sherpa-onnx AAR (on-device Parakeet STT; gitignored binary)
        working-directory: android
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-static-link-onnxruntime-1.13.3.aar
          echo "9f065fe6f2cab09fd48eaa580097293e077637ad53a5e89c5c58a36509386ac7  app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar" | sha256sum -c -

      - name: Restore permanent Android signing key
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          OPENWISPR_KEYSTORE_B64: ${{ secrets.OPENWISPR_KEYSTORE_B64 }}
        run: |
          test -n "$OPENWISPR_KEYSTORE_B64"
          printf '%s' "$OPENWISPR_KEYSTORE_B64" | base64 --decode > openwispr-release.jks
          test -s openwispr-release.jks

      - name: Build permanently signed release APK + run unit tests
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          OPENWISPR_KEYSTORE_FILE: ../openwispr-release.jks
          OPENWISPR_KEYSTORE_PASSWORD: ${{ secrets.OPENWISPR_KEYSTORE_PASSWORD }}
          OPENWISPR_KEY_ALIAS: ${{ secrets.OPENWISPR_KEY_ALIAS }}
          OPENWISPR_KEY_PASSWORD: ${{ secrets.OPENWISPR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon

      - name: Build PR debug APK + run unit tests
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      # Main builds are signed with the same private key on every run, so Android can install
      # future APKs as normal updates without deleting app data or downloaded models.
      - name: Upload permanently signed Android APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-android-signed-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK for GitHub Release
        if: startsWith(github.ref, 'refs/tags/personal-v')
        run: cp android/app/build/outputs/apk/release/app-release.apk OpenWispr-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/personal-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "OpenWispr-${{ github.ref_name }}.apk" \
            --title "OpenWispr ${{ github.ref_name }}" \
            --notes "Personal hardened Android build. Built from commit ${{ github.sha }}. Permanently signed for seamless sideloaded updates."

  # macOS was not built here until #52 sat for eleven days with a one-line compile error and a
  # green PR, because the only job in this file was the Android one. Half the codebase had no
  # signal at all: the app target was never compiled, and OpenWisprCore's 119 unit tests never
  # ran. They pass, and always did. Nobody was watching.
  macos:
    name: macOS build & unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # First, because it is the cheap half. OpenWisprCore has no external dependencies, so
      # these run in seconds without fetching a single xcframework. A logic regression fails
      # here before the runner spends minutes downloading binaries to find out.
      - name: OpenWisprCore unit tests
        working-directory: macos/OpenWisprCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch vendored sherpa-onnx xcframeworks (on-device Parakeet STT; gitignored binaries)
        run: bash macos/SherpaOnnxFramework/fetch-binaries.sh

      - name: Generate Xcode project
        working-directory: macos/App
        run: ./generate.sh

      # Debug, not the DMG. release.yml already packages and signs on a tag; the question a PR
      # needs answered is only "does it still compile", and Debug answers it faster. Signing is
      # off because CI has no keychain identity and a compile check does not need one.
      - name: Build the app (Debug)
        working-directory: macos/App
        run: |
          xcodebuild -project OpenWispr.xcodeproj -scheme OpenWispr \
            -configuration Debug -destination 'platform=macOS' \
            build CODE_SIGNING_ALLOWED=NO
